name: Update MTProxy list

on:
  schedule:
    # Every day at 03:00 UTC (06:00 Europe/Moscow during standard time)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update proxy JSON
        run: node update-proxies.mjs

      - name: Commit updated list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sponsor.json public.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: update MTProxy list"
            git push
          fi
